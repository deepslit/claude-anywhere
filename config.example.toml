# claude-anywhere configuration. Copy to config.toml and edit.

host = "0.0.0.0"
port = 21580

# Path to claude binary (auto-detected via $PATH if omitted)
# claude_bin = "/usr/local/bin/claude"

# Working directories the user can pick from when starting a new session.
# Each entry has a display name + filesystem path.
[[allowed_dirs]]
name = "My Project"
path = "/path/to/your/project"
